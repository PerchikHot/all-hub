name: Record All Hub Build Status
on:
  workflow_run:
    workflows: ["Build All Hub"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  record:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Save build status for All Hub dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p ci
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/hub-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > /tmp/hub-artifacts.json
          jq -n --arg run_id "$RUN_ID" --arg run_url "$RUN_URL" \
            --arg conclusion "$CONCLUSION" --arg head_sha "$HEAD_SHA" \
            --slurpfile jobs /tmp/hub-jobs.json \
            --slurpfile artifacts /tmp/hub-artifacts.json \
            '{run_id: ($run_id|tonumber), run_url:$run_url,
              conclusion:$conclusion, head_sha:$head_sha,
              jobs: [$jobs[0].jobs[]|{name, status, conclusion, html_url, id}],
              artifacts: [$artifacts[0].artifacts[]|{name, size_in_bytes, expired, archive_download_url}]}' \
            > /tmp/latest-build-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Several completed runs can race to update the same file. Refresh
          # from main and retry a rejected push rather than rebasing conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            existing="$(jq -r '.run_id // 0' ci/latest-build.json 2>/dev/null || echo 0)"
            if [[ "$existing" =~ ^[0-9]+$ ]] && (( existing > RUN_ID )); then
              echo "Newer build already recorded ($existing); ignoring older run $RUN_ID."
              exit 0
            fi
            cp /tmp/latest-build-status.json ci/latest-build.json
            git add ci/latest-build.json
            if git diff --cached --quiet; then
              echo "Build status unchanged."
              exit 0
            fi
            git commit -m "ci: record latest build status [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Failed to publish build status after retries." >&2
          exit 1
