name: Kopilka standalone APK
# Avoid older builds overwriting a newer standalone APK in the same release.
concurrency:
  group: kopilka-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/kopilka_page.dart'
      - 'lib/kopilka_main.dart'
      - 'kopilka/android/**'
      - 'test/kopilka_notification_amount_test.dart'
      - 'test/kopilka_history_search_test.dart'
      - 'test/kopilka_categories_test.dart'
      - 'test/kopilka_account_flow_test.dart'
      - 'test/kopilka_weekly_expenses_test.dart'
      - 'test/kopilka_budget_test.dart'
      - 'test/kopilka_notification_date_test.dart'
      - '.github/workflows/kopilka.yml'
      - 'assets/icons/kopilka.webp'
      - 'tools/generate_launcher_icon.py'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore optional permanent Kopilka signing key
        env:
          KOPILKA_KEYSTORE_BASE64: ${{ secrets.KOPILKA_KEYSTORE_BASE64 }}
          KOPILKA_STORE_PASSWORD: ${{ secrets.KOPILKA_STORE_PASSWORD }}
          KOPILKA_KEY_PASSWORD: ${{ secrets.KOPILKA_KEY_PASSWORD }}
          KOPILKA_KEY_ALIAS: ${{ secrets.KOPILKA_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          keys = ['KOPILKA_KEYSTORE_BASE64','KOPILKA_STORE_PASSWORD','KOPILKA_KEY_PASSWORD','KOPILKA_KEY_ALIAS']
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print('No permanent signing key configured; using Android debug signing for test APK. Missing: ' + ', '.join(missing))
          else:
              pathlib.Path('/tmp/kopilka-release.jks').write_bytes(base64.b64decode(os.environ['KOPILKA_KEYSTORE_BASE64'], validate=True))
          PY
      - name: Create standalone Flutter app
        env:
          KOPILKA_STORE_PASSWORD: ${{ secrets.KOPILKA_STORE_PASSWORD }}
          KOPILKA_KEY_PASSWORD: ${{ secrets.KOPILKA_KEY_PASSWORD }}
          KOPILKA_KEY_ALIAS: ${{ secrets.KOPILKA_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/kopilka_build
          cd /tmp/kopilka_build
          flutter create --platforms=android --project-name kopilka_app --org com.veyrion .
          python3 -m pip install --quiet Pillow
          python3 "$GITHUB_WORKSPACE/tools/generate_launcher_icon.py" --project kopilka --root "$PWD"
          python3 "$GITHUB_WORKSPACE/tools/generate_launcher_icon.py" --project kopilka --root "$PWD" --verify
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/tools" -p "test_verify_packaged_icon.py" -v
          cp "$GITHUB_WORKSPACE/lib/kopilka_page.dart" lib/kopilka_page.dart
          cp "$GITHUB_WORKSPACE/lib/kopilka_main.dart" lib/main.dart
          # Install a local-only Android notification listener for supported banks.
          python3 - <<'PYNOTIFY'
          from pathlib import Path
          import os
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          service = '''<service android:name=".BankNotificationService"
                  android:label="Копилка — уведомления банков"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                  android:exported="false">
                  <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
              </service>'''
          m = m.replace('</application>', service + '</application>')
          manifest.write_text(m)
          folder = Path('android/app/src/main/kotlin/com/veyrion/kopilka_app')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'BankNotificationService.kt').write_text(
              (Path(os.environ['GITHUB_WORKSPACE']) / 'kopilka/android/BankNotificationService.kt')
                  .read_text(encoding='utf-8'), encoding='utf-8')
          (folder / 'MainActivity.kt').write_text(
              (Path(os.environ['GITHUB_WORKSPACE']) / 'kopilka/android/MainActivity.kt')
                  .read_text(encoding='utf-8'), encoding='utf-8')
          PYNOTIFY
          flutter pub add shared_preferences
          python3 -m pip install --quiet Pillow
          if [ -f /tmp/kopilka-release.jks ]; then cp /tmp/kopilka-release.jks android/app/kopilka-release.jks; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildTypes {'
          assert marker in s
          if not Path('android/app/kopilka-release.jks').exists():
              print('Building test APK with debug signing; updates over differently signed installations will fail.')
              raise SystemExit(0)
          config = '''    signingConfigs {
              create("kopilkaRelease") {
                  storeFile = file("kopilka-release.jks")
                  storePassword = System.getenv("KOPILKA_STORE_PASSWORD")
                  keyAlias = System.getenv("KOPILKA_KEY_ALIAS")
                  keyPassword = System.getenv("KOPILKA_KEY_PASSWORD")
              }
          }
          '''
          s = s.replace(marker, config + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("kopilkaRelease")')
          p.write_text(s)
          PY
          rm -f test/widget_test.dart
          # Run the same finance parsing regression tests in the standalone
          # package before an APK can be published.
          cp "$GITHUB_WORKSPACE/test/kopilka_notification_amount_test.dart" test/kopilka_notification_amount_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_history_search_test.dart" test/kopilka_history_search_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_categories_test.dart" test/kopilka_categories_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_account_flow_test.dart" test/kopilka_account_flow_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_weekly_expenses_test.dart" test/kopilka_weekly_expenses_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_budget_test.dart" test/kopilka_budget_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_notification_date_test.dart" test/kopilka_notification_date_test.dart
          sed -i 's#package:all_hub/kopilka_page.dart#package:kopilka_app/kopilka_page.dart#' test/kopilka_notification_amount_test.dart test/kopilka_history_search_test.dart test/kopilka_categories_test.dart test/kopilka_account_flow_test.dart test/kopilka_weekly_expenses_test.dart test/kopilka_budget_test.dart test/kopilka_notification_date_test.dart
          flutter analyze
          flutter test test/kopilka_notification_amount_test.dart test/kopilka_history_search_test.dart test/kopilka_categories_test.dart test/kopilka_account_flow_test.dart test/kopilka_weekly_expenses_test.dart test/kopilka_budget_test.dart test/kopilka_notification_date_test.dart
          python3 "$GITHUB_WORKSPACE/tools/generate_launcher_icon.py" --project kopilka --root "$PWD" --verify
          flutter build apk --release --build-name "1.0.${GITHUB_RUN_NUMBER}" --build-number "${GITHUB_RUN_NUMBER}"
          python3 "$GITHUB_WORKSPACE/tools/verify_packaged_icon.py" --project kopilka --apk build/app/outputs/flutter-apk/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/Kopilka-Android.apk"
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Kopilka-Android-APK
          path: dist/Kopilka-Android.apk
          if-no-files-found: error
      # A debug-signed test APK must never replace a permanently signed
      # release, because Android would refuse an in-place update.
      - name: Verify permanent signing for release
        id: release_signing
        run: |
          if [ -s /tmp/kopilka-release.jks ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release publication: no permanent signing key."
          fi
      - name: Publish standalone APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kopilka-latest dist/Kopilka-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Копилка — Android APK" \
            --notes "Отдельная сборка Копилки из общего репозитория All Hub. Без KOPILKA_* secrets APK имеет тестовую debug-подпись; установка поверх APK с другим сертификатом невозможна." \
            --latest=false 2>/dev/null || \
          gh release upload kopilka-latest dist/Kopilka-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit kopilka-latest --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf 'Отдельная сборка Копилки из общего репозитория All Hub.\nVersion: 1.0.%s\n' "$GITHUB_RUN_NUMBER")"

  # Windows is a portable desktop build. It deliberately does not request
  # Android notification permissions or publish an untested auto-update.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create isolated Kopilka Windows app
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'kopilka_windows'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project
          flutter create --platforms=windows --project-name kopilka_app --org com.veyrion .
          python -m pip install --quiet Pillow pefile
          python "$env:GITHUB_WORKSPACE/tools/generate_launcher_icon.py" --project kopilka --root "$project"
          python "$env:GITHUB_WORKSPACE/tools/generate_launcher_icon.py" --project kopilka --root "$project" --verify
          Copy-Item "$env:GITHUB_WORKSPACE/lib/kopilka_page.dart" "lib/kopilka_page.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/lib/kopilka_main.dart" "lib/main.dart"
          flutter pub add shared_preferences
          Remove-Item "test/widget_test.dart" -ErrorAction SilentlyContinue
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_notification_amount_test.dart" "test/kopilka_notification_amount_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_history_search_test.dart" "test/kopilka_history_search_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_categories_test.dart" "test/kopilka_categories_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_account_flow_test.dart" "test/kopilka_account_flow_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_weekly_expenses_test.dart" "test/kopilka_weekly_expenses_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_budget_test.dart" "test/kopilka_budget_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_notification_date_test.dart" "test/kopilka_notification_date_test.dart"
          $testFile = 'test/kopilka_notification_amount_test.dart'
          (Get-Content $testFile -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $testFile
          $historyTest = 'test/kopilka_history_search_test.dart'
          (Get-Content $historyTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $historyTest
          $categoryTest = 'test/kopilka_categories_test.dart'
          (Get-Content $categoryTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $categoryTest
          $accountFlowTest = 'test/kopilka_account_flow_test.dart'
          (Get-Content $accountFlowTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $accountFlowTest
          $weeklyTest = 'test/kopilka_weekly_expenses_test.dart'
          (Get-Content $weeklyTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $weeklyTest
          $budgetTest = 'test/kopilka_budget_test.dart'
          (Get-Content $budgetTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $budgetTest
          $dateTest = 'test/kopilka_notification_date_test.dart'
          (Get-Content $dateTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $dateTest
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows analysis failed' }
          flutter test $testFile $historyTest $categoryTest $accountFlowTest $weeklyTest $budgetTest $dateTest
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows tests failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows build failed' }
          $release = Join-Path $project 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/kopilka_app.exe")) { throw 'Kopilka EXE missing' }
          python -c "import pefile; p=pefile.PE(r'$release/kopilka_app.exe'); assert any(e.id==14 for e in p.DIRECTORY_ENTRY_RESOURCE.entries), 'Kopilka EXE icon missing'"
          if (!(Test-Path "$release/flutter_windows.dll")) { throw 'Flutter runtime missing' }
          if (!(Test-Path "$release/data")) { throw 'Flutter assets missing' }
          Compress-Archive -Path "$release/*" -DestinationPath "$env:GITHUB_WORKSPACE/Kopilka-Windows-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Kopilka-Windows-portable
          path: Kopilka-Windows-portable.zip
          if-no-files-found: error
