name: all_hub
description: Unified launcher for personal projects
publish_to: none
version: 0.7.0+8
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.3.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  file_picker: ^8.3.7
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/projects.json
