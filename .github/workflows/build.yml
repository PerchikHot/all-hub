name: Build All Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name all_hub .
      - name: Configure generated Android project
        run: |
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Align Android compile SDK with plugin requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          app = Path('android/app/build.gradle.kts')
          if not app.exists():
              app = Path('android/app/build.gradle')
          if not app.exists():
              raise SystemExit('Android app Gradle configuration not found')
          text = app.read_text()
          text, count = re.subn(r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', 'compileSdk = 36' if app.suffix == '.kts' else 'compileSdkVersion 36', text, count=1)
          if count != 1:
              raise SystemExit('Could not update app compileSdk')
          app.write_text(text)
          cache = Path(os.environ['HOME']) / '.pub-cache' / 'hosted' / 'pub.dev'
          plugin_dirs = sorted(cache.glob('file_picker-*/android/build.gradle'))
          if not plugin_dirs:
              raise SystemExit('file_picker Android Gradle configuration not found')
          for gradle in plugin_dirs:
              text = gradle.read_text()
              text, count = re.subn(r'compileSdk(?:Version)?\s*(?:=\s*)?\d+', 'compileSdkVersion 36', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update compileSdk in {gradle}')
              gradle.write_text(text)
              print(f'Updated {gradle} to compileSdk 36')
          PY
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Verify Android package
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AllHub-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform scaffolding
        run: flutter create --platforms=windows --project-name all_hub .
      - name: Remove generated template test
        run: Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package portable Windows app
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/all_hub.exe")) { throw 'Windows executable missing' }
          if (!(Test-Path "$release/flutter_windows.dll")) { throw 'Flutter runtime missing' }
          if (!(Test-Path "$release/data")) { throw 'Windows data assets missing' }
          Compress-Archive -Path "$release/*" -DestinationPath 'AllHub-Windows-portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AllHub-Windows
          path: AllHub-Windows-portable.zip
          if-no-files-found: error
