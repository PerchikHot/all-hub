name: Kopilka standalone APK
# Avoid older builds overwriting a newer standalone APK in the same release.
concurrency:
  group: kopilka-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/kopilka_page.dart'
      - 'lib/kopilka_main.dart'
      - 'test/kopilka_notification_amount_test.dart'
      - 'test/kopilka_history_search_test.dart'
      - 'test/kopilka_categories_test.dart'
      - 'test/kopilka_account_flow_test.dart'
      - '.github/workflows/kopilka.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore optional permanent Kopilka signing key
        env:
          KOPILKA_KEYSTORE_BASE64: ${{ secrets.KOPILKA_KEYSTORE_BASE64 }}
          KOPILKA_STORE_PASSWORD: ${{ secrets.KOPILKA_STORE_PASSWORD }}
          KOPILKA_KEY_PASSWORD: ${{ secrets.KOPILKA_KEY_PASSWORD }}
          KOPILKA_KEY_ALIAS: ${{ secrets.KOPILKA_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          keys = ['KOPILKA_KEYSTORE_BASE64','KOPILKA_STORE_PASSWORD','KOPILKA_KEY_PASSWORD','KOPILKA_KEY_ALIAS']
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print('No permanent signing key configured; using Android debug signing for test APK. Missing: ' + ', '.join(missing))
          else:
              pathlib.Path('/tmp/kopilka-release.jks').write_bytes(base64.b64decode(os.environ['KOPILKA_KEYSTORE_BASE64'], validate=True))
          PY
      - name: Create standalone Flutter app
        env:
          KOPILKA_STORE_PASSWORD: ${{ secrets.KOPILKA_STORE_PASSWORD }}
          KOPILKA_KEY_PASSWORD: ${{ secrets.KOPILKA_KEY_PASSWORD }}
          KOPILKA_KEY_ALIAS: ${{ secrets.KOPILKA_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/kopilka_build
          cd /tmp/kopilka_build
          flutter create --platforms=android --project-name kopilka_app --org com.veyrion .
          cp "$GITHUB_WORKSPACE/lib/kopilka_page.dart" lib/kopilka_page.dart
          cp "$GITHUB_WORKSPACE/lib/kopilka_main.dart" lib/main.dart
          # Install a local-only Android notification listener for supported banks.
          python3 - <<'PYNOTIFY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          service = '''<service android:name=".BankNotificationService"
                  android:label="Копилка — уведомления банков"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                  android:exported="false">
                  <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
              </service>'''
          m = m.replace('</application>', service + '</application>')
          manifest.write_text(m)
          folder = Path('android/app/src/main/kotlin/com/veyrion/kopilka_app')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'BankNotificationService.kt').write_text(r'''
          package com.veyrion.kopilka_app
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.app.Notification
          import org.json.JSONArray
          import org.json.JSONObject

          class BankNotificationService : NotificationListenerService() {
              override fun onListenerConnected() {
                  super.onListenerConnected()
                  getSharedPreferences("kopilka_notifications", MODE_PRIVATE).edit()
                      .putBoolean("listener_connected", true)
                      .putLong("last_connected", System.currentTimeMillis()).apply()
              }

              override fun onListenerDisconnected() {
                  super.onListenerDisconnected()
                  getSharedPreferences("kopilka_notifications", MODE_PRIVATE).edit()
                      .putBoolean("listener_connected", false).apply()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn == null) return
                  val (bank, bankId) = when (sbn.packageName) {
                      "com.idamob.tinkoff.android" -> Pair("Т-Банк", "tbank")
                      "ru.gazprombank.android.mobilebank.app" -> Pair("Газпромбанк", "gazprom")
                      "ru.ozon.fintech.finance" -> Pair("Ozon Банк", "ozon")
                      else -> return
                  }
                  // Record only metadata for the diagnostic screen, not the
                  // notification text or login codes.
                  val listenerPrefs = getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                  // Count all observed supported-bank events without saving
                  // their text. These diagnostics work even for OTP or balance
                  // notifications that are intentionally excluded from import.
                  val now = System.currentTimeMillis()
                  listenerPrefs.edit().putLong("last_seen", now)
                      .putString("last_bank", bank)
                      .putLong("bank_last_" + bankId, now)
                      .putInt("bank_count_" + bankId,
                          (listenerPrefs.getInt("bank_count_" + bankId, 0) + 1)
                              .coerceAtMost(100000000)).apply()
                  val extras = sbn.notification.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val normalText = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val expandedText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString() ?: ""
                  val body = if (expandedText.isNotBlank()) expandedText else normalText
                  // Never persist oversized or malformed notification payloads.
                  if (body.isBlank() || body.length > 2048 || title.length > 200) return
                  // Store transaction alerts only. Never retain OTP/login codes,
                  // promotions or balance-only notifications in the local queue.
                  val combined = title + " " + body
                  val transaction = Regex(
                      """покупк|оплат|списан|перевод|поступ|зачисл|пополн|возврат|кэшбэк|кешбэк|сняти|выдач|purchase|payment|transfer|refund|credited|deposit|withdraw""",
                      RegexOption.IGNORE_CASE)
                  val currency = Regex("""₽|руб(?:\.|ля|лей)?|\bRUB\b""", RegexOption.IGNORE_CASE)
                  val sensitive = Regex(
                      """код\s+(?:подтверждения|входа|для\s+(?:входа|подтверждения)|операции|из\s+смс)|(?:sms|смс)[-\s]*код|одноразов(?:ый|ого)\s+код|никому\s+не\s+сообщайте|verification\s+code|one[- ]time\s+(?:password|code)|\bOTP\b""",
                      RegexOption.IGNORE_CASE)
                  // The native queue must reject unposted payments and
                  // credential alerts BEFORE storing their text on disk.
                  val notPosted = Regex(
                      """отклон[её]н|не\s+(?:выполнен|прошл[ао]|провед[её]н|подтвержд[её]н|заверш[её]н)|неуспешн|отмен[её]н|недостаточн[а-яё]*\s+средств|ожида[её]т\s+подтверждени|в\s+обработк|запланирован[а-яё]*|ожидается\s+(?:завтра|послезавтра)|будет\s+списан|declined|rejected|failed|cancelled|canceled|pending|processing|scheduled|upcoming|insufficient\s+funds|\bblocked\b|\bsuspended\b""",
                      RegexOption.IGNORE_CASE)
                  val credentials = Regex(
                      """парол[ья]|password|passcode|\bpin\b|\bcvv\b|\bcvc\b|код\s*[:№]|(?:ваш|your)\s+(?:код|code)""",
                      RegexOption.IGNORE_CASE)
                  if (!transaction.containsMatchIn(combined) ||
                      !currency.containsMatchIn(combined) ||
                      sensitive.containsMatchIn(combined) ||
                      credentials.containsMatchIn(combined) ||
                      notPosted.containsMatchIn(combined)) return
                  val prefs = getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                  // A damaged local queue must not crash NotificationListenerService.
                  // Recover the pending queue without touching saved transactions.
                  val current = try {
                      JSONArray(prefs.getString("queue", "[]"))
                  } catch (ignored: org.json.JSONException) {
                      JSONArray()
                  }
                  val key = "${sbn.packageName}:${sbn.id}:${sbn.postTime}:${body.hashCode()}"
                  for (i in 0 until current.length()) {
                      if (current.optJSONObject(i)?.optString("key") == key) return
                  }
                  current.put(JSONObject().put("key", key).put("bank", bank)
                      .put("title", title).put("body", body).put("time", sbn.postTime))
                  while (current.length() > 100) current.remove(0)
                  prefs.edit().putString("queue", current.toString()).apply()
              }
          }
          ''')
          (folder / 'MainActivity.kt').write_text(r'''
          package com.veyrion.kopilka_app
          import android.content.ComponentName
          import android.content.Intent
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "kopilka/notifications")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "openSettings" -> {
                                  startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  result.success(null)
                              }
                              "enabled" -> {
                                  val listeners = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                                  // Match the exact listener component, not a substring of
                                  // another application's package name.
                                  val enabled = listeners.split(':').any { entry ->
                                      val component = ComponentName.unflattenFromString(entry.trim())
                                      component != null &&
                                          component.packageName == packageName &&
                                          component.className == BankNotificationService::class.java.name
                                  }
                                  result.success(enabled)
                              }
                              "pending" -> {
                                  val prefs = getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                                  result.success(prefs.getString("queue", "[]"))
                              }
                              "diagnostics" -> {
                                  val prefs = getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                                  val count = try {
                                      org.json.JSONArray(prefs.getString("queue", "[]")).length()
                                  } catch (_: Exception) { 0 }
                                  result.success(mapOf(
                                      "queued" to count,
                                      "lastSeen" to prefs.getLong("last_seen", 0L),
                                      "lastBank" to (prefs.getString("last_bank", "") ?: ""),
                                      "connected" to prefs.getBoolean("listener_connected", false),
                                      "lastConnected" to prefs.getLong("last_connected", 0L),
                                      "bankEvents" to mapOf(
                                          "Т-Банк" to prefs.getInt("bank_count_tbank", 0),
                                          "Газпромбанк" to prefs.getInt("bank_count_gazprom", 0),
                                          "Ozon Банк" to prefs.getInt("bank_count_ozon", 0)
                                      ),
                                      "bankLastSeen" to mapOf(
                                          "Т-Банк" to prefs.getLong("bank_last_tbank", 0L),
                                          "Газпромбанк" to prefs.getLong("bank_last_gazprom", 0L),
                                          "Ozon Банк" to prefs.getLong("bank_last_ozon", 0L)
                                      )
                                  ))
                              }
                              "dismiss" -> {
                                  val key = call.argument<String>("key")
                                  if (key.isNullOrBlank()) {
                                      result.error("ARGUMENT", "Missing notification key", null)
                                  } else {
                                      val prefs = getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                                      try {
                                          val current = org.json.JSONArray(prefs.getString("queue", "[]"))
                                          val remaining = org.json.JSONArray()
                                          for (i in 0 until current.length()) {
                                              val item = current.getJSONObject(i)
                                              if (item.optString("key") != key) remaining.put(item)
                                          }
                                          prefs.edit().putString("queue", remaining.toString()).apply()
                                          result.success(null)
                                      } catch (_: Exception) {
                                          result.error("QUEUE", "Cannot update local notification queue", null)
                                      }
                                  }
                              }
                              "clear" -> {
                                  getSharedPreferences("kopilka_notifications", MODE_PRIVATE)
                                      .edit().remove("queue").apply()
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          ''')
          PYNOTIFY
          flutter pub add shared_preferences
          python3 -m pip install --quiet Pillow
          python3 - <<'PYICON'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              image = Image.new('RGBA', (size,size), (10,20,38,255))
              draw = ImageDraw.Draw(image)
              m = int(size*.10)
              draw.rounded_rectangle((m,m,size-m,size-m), radius=int(size*.23), fill=(30,57,110,255))
              draw.ellipse((int(size*.24),int(size*.22),int(size*.76),int(size*.74)), outline=(150,193,255,255), width=max(2,int(size*.07)))
              draw.line((int(size*.49),int(size*.32),int(size*.49),int(size*.67)), fill=(230,240,255,255), width=max(2,int(size*.07)))
              draw.line((int(size*.39),int(size*.46),int(size*.60),int(size*.46)), fill=(230,240,255,255), width=max(2,int(size*.05)))
              path = Path('android/app/src/main/res') / ('mipmap-'+density) / 'ic_launcher.png'
              path.parent.mkdir(parents=True, exist_ok=True)
              image.save(path)
          PYICON
          if [ -f /tmp/kopilka-release.jks ]; then cp /tmp/kopilka-release.jks android/app/kopilka-release.jks; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildTypes {'
          assert marker in s
          if not Path('android/app/kopilka-release.jks').exists():
              print('Building test APK with debug signing; updates over differently signed installations will fail.')
              raise SystemExit(0)
          config = '''    signingConfigs {
              create("kopilkaRelease") {
                  storeFile = file("kopilka-release.jks")
                  storePassword = System.getenv("KOPILKA_STORE_PASSWORD")
                  keyAlias = System.getenv("KOPILKA_KEY_ALIAS")
                  keyPassword = System.getenv("KOPILKA_KEY_PASSWORD")
              }
          }
          '''
          s = s.replace(marker, config + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("kopilkaRelease")')
          p.write_text(s)
          PY
          rm -f test/widget_test.dart
          # Run the same finance parsing regression tests in the standalone
          # package before an APK can be published.
          cp "$GITHUB_WORKSPACE/test/kopilka_notification_amount_test.dart" test/kopilka_notification_amount_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_history_search_test.dart" test/kopilka_history_search_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_categories_test.dart" test/kopilka_categories_test.dart
          cp "$GITHUB_WORKSPACE/test/kopilka_account_flow_test.dart" test/kopilka_account_flow_test.dart
          sed -i 's#package:all_hub/kopilka_page.dart#package:kopilka_app/kopilka_page.dart#' test/kopilka_notification_amount_test.dart test/kopilka_history_search_test.dart test/kopilka_categories_test.dart test/kopilka_account_flow_test.dart
          flutter analyze
          flutter test test/kopilka_notification_amount_test.dart test/kopilka_history_search_test.dart test/kopilka_categories_test.dart test/kopilka_account_flow_test.dart
          flutter build apk --release --build-name "1.0.${GITHUB_RUN_NUMBER}" --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/Kopilka-Android.apk"
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Kopilka-Android-APK
          path: dist/Kopilka-Android.apk
          if-no-files-found: error
      # A debug-signed test APK must never replace a permanently signed
      # release, because Android would refuse an in-place update.
      - name: Verify permanent signing for release
        id: release_signing
        run: |
          if [ -s /tmp/kopilka-release.jks ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release publication: no permanent signing key."
          fi
      - name: Publish standalone APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kopilka-latest dist/Kopilka-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Копилка — Android APK" \
            --notes "Отдельная сборка Копилки из общего репозитория All Hub. Без KOPILKA_* secrets APK имеет тестовую debug-подпись; установка поверх APK с другим сертификатом невозможна." \
            --latest=false 2>/dev/null || \
          gh release upload kopilka-latest dist/Kopilka-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit kopilka-latest --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf 'Отдельная сборка Копилки из общего репозитория All Hub.\nVersion: 1.0.%s\n' "$GITHUB_RUN_NUMBER")"

  # Windows is a portable desktop build. It deliberately does not request
  # Android notification permissions or publish an untested auto-update.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create isolated Kopilka Windows app
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'kopilka_windows'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project
          flutter create --platforms=windows --project-name kopilka_app --org com.veyrion .
          Copy-Item "$env:GITHUB_WORKSPACE/lib/kopilka_page.dart" "lib/kopilka_page.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/lib/kopilka_main.dart" "lib/main.dart"
          flutter pub add shared_preferences
          Remove-Item "test/widget_test.dart" -ErrorAction SilentlyContinue
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_notification_amount_test.dart" "test/kopilka_notification_amount_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_history_search_test.dart" "test/kopilka_history_search_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_categories_test.dart" "test/kopilka_categories_test.dart"
          Copy-Item "$env:GITHUB_WORKSPACE/test/kopilka_account_flow_test.dart" "test/kopilka_account_flow_test.dart"
          $testFile = 'test/kopilka_notification_amount_test.dart'
          (Get-Content $testFile -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $testFile
          $historyTest = 'test/kopilka_history_search_test.dart'
          (Get-Content $historyTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $historyTest
          $categoryTest = 'test/kopilka_categories_test.dart'
          (Get-Content $categoryTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $categoryTest
          $accountFlowTest = 'test/kopilka_account_flow_test.dart'
          (Get-Content $accountFlowTest -Raw).Replace('package:all_hub/kopilka_page.dart', 'package:kopilka_app/kopilka_page.dart') | Set-Content $accountFlowTest
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows analysis failed' }
          flutter test $testFile $historyTest $categoryTest $accountFlowTest
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows tests failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Kopilka Windows build failed' }
          $release = Join-Path $project 'build/windows/x64/runner/Release'
          if (!(Test-Path "$release/kopilka_app.exe")) { throw 'Kopilka EXE missing' }
          if (!(Test-Path "$release/flutter_windows.dll")) { throw 'Flutter runtime missing' }
          if (!(Test-Path "$release/data")) { throw 'Flutter assets missing' }
          Compress-Archive -Path "$release/*" -DestinationPath "$env:GITHUB_WORKSPACE/Kopilka-Windows-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Kopilka-Windows-portable
          path: Kopilka-Windows-portable.zip
          if-no-files-found: error
